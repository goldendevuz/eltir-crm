services:
  db:
    container_name: PostgresDb
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - ./postgres/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: tgbot
      POSTGRES_PASSWORD: tgbot
      POSTGRES_DB: tgshop
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tgbot -d tgshop" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - botnet

  redis:
    container_name: Redis
    image: redis:alpine
    networks:
      - botnet

  web:
    container_name: BotAndDjango
    build: .
    command: ["bash", "/app/docker/entrypoint.sh"]
    restart: unless-stopped
    volumes:
      - .:/app
    env_file: ".env"
    ports:
      - "8090:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    links:
       - db
       - redis
    networks:
      - botnet

  # Panelni panel.univel.uz manzilida ochadi. Tunnel chiquvchi ulanish
  # o'rnatgani uchun serverda hech qanday port ochish yoki TLS sozlash
  # kerak emas — 8090 portini internetga chiqarmasa ham bo'ladi.
  #
  # Token Cloudflare Zero Trust panelida yaratiladi (Networks → Tunnels),
  # o'sha yerda public hostname sifatida panel.univel.uz → http://web:8000
  # ko'rsatiladi. `web` — shu tarmoqdagi konteyner nomi, 8000 — uning ichki
  # porti (8090 host tomonidagi ko'rinishi, tunnelga kerak emas).
  #
  # CLOUDFLARE_TUNNEL_TOKEN .env da bo'lmasa xizmat ishga tushmaydi,
  # shuning uchun u "tunnel" profiliga qo'yilgan: lokalda oddiy
  # `docker compose up -d` uni umuman ko'tarmaydi.
  cloudflared:
    container_name: Cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    networks:
      - botnet
    profiles: ["tunnel"]

networks:
  botnet:
    driver: bridge